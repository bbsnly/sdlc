# SonarCloud automatic analysis reads this file. Go keeps a test beside the code it tests, so
# without these lines every _test.go file is analysed as production code and judged by rules
# (function complexity, duplicated literals) that are not meant for tests.
sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# A test is long where its table is long, and checks a value in the same `if`
# that takes it. These rules are for the code under test, and stay on for it.
sonar.issue.ignore.multicriteria=testcomplexity,testifshort,testifdecl
sonar.issue.ignore.multicriteria.testcomplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testcomplexity.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.testifshort.ruleKey=godre:S8193
sonar.issue.ignore.multicriteria.testifshort.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.testifdecl.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.testifdecl.resourceKey=**/*_test.go
