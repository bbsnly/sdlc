# SonarCloud automatic analysis reads this file. Tests are left out of the analysis: it holds a
# test to the rules for the code under test (function complexity, a variable declared in an if),
# and this file cannot turn a rule off for some files only. golangci-lint and the npm test run
# are what hold the tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,npm/test/**
