# Taskfile for sdlc.
#
# Every tool this repository uses is pinned here, in one place, and run in
# isolation. Go tools run via `go run <module>@<version>`, which resolves each
# tool against its own dependency graph and leaves go.mod untouched; Node tools
# run via `npx <pkg>@<version>`. Nothing is vendored into the product module.
#
# The two exceptions are Go itself and shellcheck, which have no such mechanism.
# Both are checked for presence and version, and both fail with an install line
# rather than skipping: a check that skips is a check that lies.

version: '3'

vars:
  # Pinned tool versions. Bump by hand -- Dependabot covers neither `go run`
  # pins nor npx pins. The `task` wrapper scripts read TASK_VERSION from here.
  TASK_VERSION: 3.53.1
  GOLANGCI_VERSION: 2.13.2
  ACTIONLINT_VERSION: 1.7.12
  GITLEAKS_VERSION: 8.30.1
  GORELEASER_VERSION: 2.18.1
  GOLICENSES_VERSION: 2.0.1
  SYFT_VERSION: 1.51.1
  MARKDOWNLINT_VERSION: 0.23.2
  SHELLCHECK_VERSION: 0.11.0

  # A hook runs on every matching tool call, so package init is on the
  # latency path of the user's whole session. Budget in milliseconds.
  INIT_BUDGET_MS: 3

  GOLICENSES: go run github.com/google/go-licenses/v2@v{{.GOLICENSES_VERSION}}
  GOLANGCI: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v{{.GOLANGCI_VERSION}}
  ACTIONLINT: go run github.com/rhysd/actionlint/cmd/actionlint@v{{.ACTIONLINT_VERSION}}
  GITLEAKS: go run github.com/zricethezav/gitleaks/v8@v{{.GITLEAKS_VERSION}}
  MARKDOWNLINT: npx --yes markdownlint-cli2@{{.MARKDOWNLINT_VERSION}}

tasks:
  default:
    desc: Run the full local bar
    cmds:
      - task: check

  check:
    desc: Everything that gates a commit. Never skips a leg.
    cmds:
      - task: tools
      - task: fmt-check
      - task: vet
      - task: lint
      - task: test
      - task: npm-test
      - task: actionlint
      - task: shellcheck
      - task: powershell
      - task: markdownlint
      - task: linkcheck
      - task: init-time
      - task: parity-selftest
      - task: release-check
      - task: licenses
      - task: secrets
      - task: no-internal-docs

  tools:
    desc: Assert the toolchain this repository requires is present at the pinned versions
    silent: true
    cmds:
      - |
        fail=0
        have_go=$(go version 2>/dev/null | awk '{print $3}' | sed 's/^go//')
        want_go=$(awk '/^go /{print $2; exit}' go.mod)
        if [ -z "$have_go" ]; then
          echo "sdlc: Go is not installed. Install Go ${want_go} or newer: https://go.dev/dl/" >&2
          fail=1
        fi
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "sdlc: shellcheck is not installed. This repository pins {{.SHELLCHECK_VERSION}}." >&2
          echo "      macOS:  brew install shellcheck" >&2
          echo "      Linux:  apt-get install shellcheck   (or: dnf install ShellCheck)" >&2
          echo "      Other:  https://github.com/koalaman/shellcheck#installing" >&2
          fail=1
        else
          have_sc=$(shellcheck --version | awk '/^version:/{print $2}')
          if [ "$have_sc" != "{{.SHELLCHECK_VERSION}}" ]; then
            echo "sdlc: shellcheck ${have_sc} is installed, this repository pins {{.SHELLCHECK_VERSION}}." >&2
            echo "      Different versions disagree about what is a warning. Install the pinned one," >&2
            echo "      or bump SHELLCHECK_VERSION in Taskfile.yml on trunk if the new one is correct." >&2
            fail=1
          fi
        fi
        if ! command -v node >/dev/null 2>&1; then
          # A version manager (nvm, fnm, asdf) often installs node as a shell
          # function that only exists in an interactive shell. The node is
          # really there; it is just invisible to scripts and to CI. Saying
          # "install Node" to someone who has four of them is unhelpful, so
          # look before prescribing.
          found=""
          for candidate in "$HOME"/.nvm/versions/node/*/bin/node \
                           "$HOME"/.local/share/fnm/node-versions/*/installation/bin/node \
                           "$HOME"/.asdf/installs/nodejs/*/bin/node \
                           "$HOME"/.volta/tools/image/node/*/bin/node; do
            [ -x "$candidate" ] && found="$candidate" && break
          done
          if [ -n "$found" ]; then
            echo "sdlc: node is installed at ${found}, but it is not on PATH for" >&2
            echo "      non-interactive shells -- your version manager exposes it as a shell" >&2
            echo "      function, so scripts and CI cannot see it." >&2
            echo "      Fix, for this shell and anything it starts:" >&2
            echo "        export PATH=\"$(dirname "$found"):\$PATH\"" >&2
            echo "      To make it permanent, load your version manager eagerly rather than" >&2
            echo "      lazily, or add that directory to PATH in your shell profile." >&2
          else
            echo "sdlc: Node is not installed, and markdownlint runs through npx." >&2
            echo "      Install Node 22 or newer: https://nodejs.org/en/download" >&2
          fi
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1

  build:
    desc: Build the sdlc binary into dist/
    silent: true
    cmds:
      - |
        out=dist/sdlc
        [ "{{OS}}" = "windows" ] && out=dist/sdlc.exe
        mkdir -p dist
        go build -o "$out" ./cmd/sdlc
        echo "built $out"
        echo
        echo "To try the plugin from this checkout:"
        echo "  export PATH=\"$(pwd)/dist:\$PATH\""
        echo "  claude --plugin-dir $(pwd)/plugin"

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./...

  fmt-check:
    desc: Fail if any Go source is unformatted
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l . 2>/dev/null)
        if [ -n "$unformatted" ]; then
          echo "sdlc: these files are not gofmt-clean:" >&2
          echo "$unformatted" >&2
          echo "      Fix: ./task fmt" >&2
          exit 1
        fi

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint
    cmds:
      - "{{.GOLANGCI}} run"

  test:
    desc: Go tests with race detection
    cmds:
      - go test -race ./...

  npm-test:
    desc: Test the npm installer package
    silent: true
    cmds:
      - |
        # `node --test DIR` treats the directory as one test file; the glob is
        # what makes it run each file. Quoted so the shell leaves it to node.
        #
        # Captured rather than piped. Task's embedded shell has errexit on but
        # pipefail off, so `node --test ... | tail` reported the failure in its
        # output and still exited 0 -- this leg could not fail. Same shape as
        # parity-selftest below, for the same reason.
        out=$(node --test 'npm/test/*.test.js' 2>&1) || {
          echo "$out" >&2
          exit 1
        }
        echo "$out" | tail -n 8

  actionlint:
    desc: Lint GitHub Actions workflows
    cmds:
      - "{{.ACTIONLINT}}"

  shellcheck:
    desc: Lint shell scripts
    silent: true
    cmds:
      - |
        # The vendored legacy kit under test/parity/legacy is a fixture: the
        # differential tests compare against it byte for byte, so restyling it
        # would break the thing it exists to prove.
        # 'plugin/bin/sdlc-hook' by name: it has no .sh suffix, and it is the
        # one script that runs on every matching tool call in every session.
        files=$(git ls-files '*.sh' 'task' 'plugin/bin/sdlc-hook' 2>/dev/null |
          grep -v '^test/parity/legacy/' || true)
        if [ -n "$files" ]; then
          # shellcheck disable=SC2086
          shellcheck $files
        fi

  shellcheck-checksums:
    desc: Regenerate .github/shellcheck.sha256 after bumping SHELLCHECK_VERSION
    silent: true
    cmds:
      - |
        # Run this on trunk whenever SHELLCHECK_VERSION changes. CI installs
        # shellcheck from a GitHub release asset, and a release asset can be
        # replaced without the tag moving, so the bytes are pinned here.
        set -eu
        version="{{.SHELLCHECK_VERSION}}"
        out=.github/shellcheck.sha256
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        {
          echo "# sha256 of every shellcheck release asset CI installs, cross-checked against"
          echo "# the digests GitHub reports for the release. The version is in the filename,"
          echo "# so bumping SHELLCHECK_VERSION in Taskfile.yml without regenerating this file"
          echo "# fails the lookup rather than passing with a stale hash."
          echo "#"
          echo "# Regenerate with: ./task shellcheck-checksums"
        } > "$tmp/out"
        for asset in \
          "shellcheck-v${version}.darwin.aarch64.tar.xz" \
          "shellcheck-v${version}.darwin.x86_64.tar.xz" \
          "shellcheck-v${version}.linux.aarch64.tar.xz" \
          "shellcheck-v${version}.linux.x86_64.tar.xz" \
          "shellcheck-v${version}.zip"; do
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 -o "$tmp/$asset" "$url"
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$tmp/$asset" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$tmp/$asset" | awk '{print $1}')
          fi
          # GNU coreutils prefixes the line with a backslash when the filename
          # contains one, which is what a Windows temporary path looks like.
          sum="${sum#\\}"
          printf '%s  %s\n' "$sum" "$asset" >> "$tmp/out"
          echo "  $asset  $sum" >&2
        done
        mv "$tmp/out" "$out"
        echo "wrote $out" >&2

  powershell:
    desc: Parse install.ps1, so a syntax error is not first seen by a Windows user
    silent: true
    cmds:
      - |
        # Scope, declared rather than hidden: PowerShell is a large install to
        # ask of a contributor on macOS or Linux. Every CI runner has it --
        # including the Ubuntu and macOS ones -- so this leg runs on every
        # commit on all three, and the file is never merged unparsed. It is
        # just not always parsed on a developer's own machine.
        for shell in pwsh powershell; do
          if command -v "$shell" >/dev/null 2>&1; then
            "$shell" -NoProfile -NonInteractive -Command '
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
              Write-Output "powershell: install.ps1 parses"'
            exit $?
          fi
        done
        echo "powershell: not run -- no pwsh here. This leg runs on the Windows CI runner on every commit."

  markdownlint:
    desc: Lint Markdown
    cmds:
      - "{{.MARKDOWNLINT}}"

  linkcheck:
    desc: Check relative links in README.md and docs/, and that README links into no docs/ page
    cmds:
      - go run ./internal/tools/linkcheck

  init-time:
    desc: Assert package init stays inside the hook latency budget
    silent: true
    cmds:
      - |
        bin="${TMPDIR:-/tmp}/sdlc-init-$$"
        go build -o "$bin" ./cmd/sdlc
        # The first run of a fresh binary pays to page itself in, which on a
        # shared CI runner can be ten times the steady-state cost and has
        # nothing to do with how much init the code does. Take the floor of
        # several runs: that is the number a hook actually pays, since a
        # session invokes the binary over and over.
        total=""
        for _ in 1 2 3 4; do
          run=$(GODEBUG=inittrace=1 "$bin" version 2>&1 >/dev/null \
            | awk '/^init /{for(i=1;i<=NF;i++) if($i=="clock,") s+=$(i-2)} END{printf "%.3f", s+0}')
          total=$(awk -v a="$total" -v b="$run" 'BEGIN{ if (a=="" || b+0 < a+0) print b; else print a }')
        done
        rm -f "$bin"
        over=$(awk -v t="$total" -v b="{{.INIT_BUDGET_MS}}" 'BEGIN{print (t>b) ? 1 : 0}')
        if [ "$over" = "1" ]; then
          echo "sdlc: package init takes ${total} ms, over the ${b:-3} ms budget." >&2
          echo "      A hook runs on every matching tool call, so this is felt on every" >&2
          echo "      turn of the user's session. Find it with:" >&2
          echo "        go build -o /tmp/sdlc ./cmd/sdlc && GODEBUG=inittrace=1 /tmp/sdlc version" >&2
          echo "      The usual cause is a new import doing work in init() or in a" >&2
          echo "      package-level variable. Move it into a function." >&2
          exit 1
        fi
        echo "init: ${total} ms (budget {{.INIT_BUDGET_MS}} ms)"

  parity-selftest:
    desc: Run the vendored legacy kit's own selftest, which is the parity contract
    silent: true
    cmds:
      - |
        # Scope, declared rather than skipped: the vendored kit is POSIX shell
        # and does not pass its own selftest on Windows. It reaches "gate 3
        # freeze" and dies there under `set -euo pipefail`. That is not a
        # regression to chase -- it is the baseline. The kit was written for
        # macOS and Linux, and Windows support is one of the reasons the Go
        # port exists, so the port's own tests are what run on windows-latest.
        # If this ever needs revisiting, the evidence is that it fails in the
        # freeze step's hashing, not in the harness around it.
        if [ "{{OS}}" = "windows" ]; then
          echo "parity: not run on Windows -- the legacy shell kit does not support it (by design; see the port's own Windows tests)"
          exit 0
        fi
        if ! command -v jq >/dev/null 2>&1; then
          echo "sdlc: jq is not installed, and the vendored kit's selftest needs it." >&2
          echo "      macOS:  brew install jq" >&2
          echo "      Linux:  apt-get install jq" >&2
          echo "      This leg proves the port still matches the shell kit it replaces," >&2
          echo "      so it fails rather than skips." >&2
          exit 1
        fi
        # SDLC_KIT points at the *parent* of the kit: the selftest resolves
        # $SDLC_KIT/sdlc/..., mirroring how the kit installs under ~/.claude.
        # Without this it silently tests whatever is installed on the machine
        # rather than the vendored copy -- a false green, and how this leg
        # first passed locally and failed on all three CI runners.
        #
        # The path is computed inside bash, not here. Task's embedded shell
        # reports pwd as a native Windows path (D:\a\...), and the selftest
        # puts $SDLC_KIT/sdlc/bin on PATH -- where Git Bash needs a POSIX path
        # or the `gate` it just added is not found.
        out=$(bash -c '
          kit=$(cd test/parity/legacy && pwd)
          # Git Bash inherits a native PWD from the parent, so pwd yields
          # D:/a/... rather than /d/a/... . The selftest puts $SDLC_KIT/sdlc/bin
          # on PATH, and a drive-letter entry there is silently ignored -- every
          # `gate` call then reports "command not found" on Windows alone.
          command -v cygpath >/dev/null 2>&1 && kit=$(cygpath -u "$kit")
          SDLC_KIT="$kit" exec bash "$kit/sdlc/bin/selftest.sh"' 2>&1) || {
          echo "$out" >&2
          exit 1
        }
        echo "$out" | tail -n 1

  licenses:
    desc: Assert every dependency that ships in the binary has a licence we can ship
    silent: true
    cmds:
      - |
        # The binary is redistributed -- in release archives, through npm, on
        # other people's machines -- so what is linked into it is what this
        # project is handing out. A dependency whose licence does not permit
        # that is a problem to find on the commit that adds it, not in an
        # issue from someone's legal team.
        {{.GOLICENSES}} check ./cmd/sdlc \
          --allowed_licenses=MIT,Apache-2.0,BSD-3-Clause,BSD-2-Clause,ISC
        echo "licenses: every dependency in the binary is redistributable"

  release-check:
    desc: Assert every file that carries the version agrees, and the changelog has a section for it
    cmds:
      - go run ./internal/tools/release check

  release-snapshot:
    desc: Build the release archives locally, without tagging or publishing anything
    silent: true
    cmds:
      - |
        # --skip=sbom: the SBOM step shells out to syft, which the release
        # workflow installs and a laptop generally has not. Everything else --
        # the builds, the archives, the checksums -- is exactly what a release
        # produces, which is the point of running this before cutting one.
        #
        # A snapshot is named from the last tag: `0.2.0-snapshot` after v0.2.0,
        # and `0.0.0-snapshot` in a checkout that has never been tagged.
        # GORELEASER_CURRENT_TAG does not override it -- snapshot mode ignores
        # that variable -- so the number here is not the one in plugin.json,
        # and is not meant to be. Everything else is what a release produces.
        go run github.com/goreleaser/goreleaser/v2@v{{.GORELEASER_VERSION}} \
          release --snapshot --clean --skip=sbom
        echo
        echo "dist/ now holds what a release would publish:"
        ls -1 dist/*.tar.gz dist/*.zip dist/checksums.txt 2>/dev/null || true

  secrets:
    desc: Scan for committed credentials
    cmds:
      - "{{.GITLEAKS}} git --no-banner --redact -v"

  no-internal-docs:
    desc: Assert no internal document and no third party's machine path is tracked
    silent: true
    cmds:
      - go run ./internal/tools/linkcheck -mode=hygiene
