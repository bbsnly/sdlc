# Taskfile for sdlc.
#
# Every tool this repository uses is pinned here, in one place, and run in
# isolation. Go tools run via `go run <module>@<version>`, which resolves each
# tool against its own dependency graph and leaves go.mod untouched; markdownlint
# installs from the lockfile in .github/tools/markdownlint, which pins every
# package under it as well. Nothing is vendored into the product module.
#
# The two exceptions are Go itself and shellcheck, which have no such mechanism.
# Both are checked for presence and version, and both fail with an install line
# rather than skipping: a check that skips is a check that lies. syft, which only
# the release job runs, is installed there from a hash-pinned release asset, as
# shellcheck is in CI.

version: '3'

vars:
  # Pinned tool versions. Bump by hand -- Dependabot covers neither `go run`
  # pins nor the markdownlint lockfile. The `task` wrapper scripts read
  # TASK_VERSION from here.
  TASK_VERSION: 3.54.0
  GOLANGCI_VERSION: 2.14.0
  ACTIONLINT_VERSION: 1.7.12
  GITLEAKS_VERSION: 8.30.1
  GORELEASER_VERSION: 2.18.3
  GOLICENSES_VERSION: 2.0.1
  SYFT_VERSION: 1.55.0
  SHELLCHECK_VERSION: 0.11.0
  # golang.org/x/perf tags no releases, so benchstat's pin is a pseudo-version.
  BENCHSTAT_VERSION: 0.0.0-20261009192801-be2c69fb417e

  # A hook runs on every matching tool call, so package init is on the
  # latency path of the user's whole session. Budget in milliseconds.
  INIT_BUDGET_MS: 3

  # The classifier has a budget too, which init cannot see: init has run before
  # a command is read. The hook gives itself 25 seconds and refuses a call it
  # has not decided by then, so a classifier that gets slower refuses, for
  # time, long commands it used to answer. One ceiling for each of three
  # commands that are slow by construction, at 8 KB, in milliseconds: about 2.7
  # times what the tree took when they were set, so that a change which halves
  # the input needed to reach the deadline, four times the time, fails. One
  # figure for all three would let the two cheaper ones get eight times slower
  # unseen. The six shapes US-035 added are held to the perl figure and take
  # none of their own. A person raises one, and the same figure in
  # test/checklegs/hooktime_test.go with it, only as CONTRIBUTING.md says.
  HOOK_PERL_BUDGET_MS: 3000
  HOOK_HERESTRING_BUDGET_MS: 1000
  HOOK_DOTGLOB_BUDGET_MS: 1000

  # go test's limit for one package, which `test` and `check-linux` give it.
  # Its reasons are in `test`.
  TEST_TIMEOUT: 20m

  GOLICENSES: go run github.com/google/go-licenses/v2@v{{.GOLICENSES_VERSION}}
  GOLANGCI: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v{{.GOLANGCI_VERSION}}
  ACTIONLINT: go run github.com/rhysd/actionlint/cmd/actionlint@v{{.ACTIONLINT_VERSION}}
  GITLEAKS: go run github.com/zricethezav/gitleaks/v8@v{{.GITLEAKS_VERSION}}
  BENCHSTAT: go run golang.org/x/perf/cmd/benchstat@v{{.BENCHSTAT_VERSION}}

  # A scratch directory, wherever the platform keeps them. On Windows task runs
  # its own mktemp in place of the one on PATH, and that one knows only TMPDIR
  # and /tmp: Windows sets neither, so the secrets leg ended in "mktemp:
  # GetFileAttributesEx /tmp: The system cannot find the file specified". So
  # TMPDIR is given for the one command, from what Windows does set; every
  # mktemp reads it, and where it is already set nothing changes.
  MKTEMP_DIR: TMPDIR="${TMPDIR:-${TEMP:-${TMP:-${RUNNER_TEMP:-/tmp}}}}" mktemp -d

  # Run over a failing leg's own output: after every line that names a file,
  # says whether git tracks it. A leg that failed on a gitignored or untracked
  # file looked, from its output alone, exactly like one that failed on a file
  # a clean clone would also have, so the failure could not be told apart
  # from one the contributor could never reproduce.
  #
  # Lists arrive through ENVIRON, not `-v`: the macOS awk rejects `-v name=value`
  # outright when the value holds a newline. A plain substring match is
  # deliberate; a file name is not worth a parser per tool.
  ANNOTATE_AWK: |
    BEGIN {
      nt = split(ENVIRON["sdlc_tracked"], tf, "\n")
      nu = split(ENVIRON["sdlc_untracked"], uf, "\n")
      ni = split(ENVIRON["sdlc_ignored"], gf, "\n")
    }
    {
      print $0
      # markdownlint-cli2 echoes the globs it ignored on a "Finding:" line; that
      # names a pattern, not a file it objected to.
      if (index($0, "Finding:") == 1) next
      for (i = 1; i <= nt; i++) {
        f = tf[i]
        if (f != "" && index($0, f) > 0)
          print "sdlc: " f " is tracked by git."
      }
      for (i = 1; i <= nu; i++) {
        f = uf[i]
        if (f != "" && index($0, f) > 0)
          print "sdlc: " f " is untracked; once you `git add` it, CI will report this too."
      }
      for (i = 1; i <= ni; i++) {
        f = gf[i]
        if (f != "" && index($0, f) > 0)
          print "sdlc: " f " is gitignored, so a clean clone does not have it and CI will not report this."
      }
    }

tasks:
  default:
    desc: Run the full local bar
    cmds:
      - task: check

  check:
    desc: Everything that gates a commit. Never skips a leg.
    cmds:
      - task: tools
      - task: fmt-check
      - task: tidy-check
      - task: vet
      - task: lint
      - task: test
      - task: npm-test
      - task: actionlint
      - task: shellcheck
      - task: powershell
      - task: markdownlint
      - task: linkcheck
      - task: init-time
      - task: release-check
      - task: licenses
      - task: secrets
      - task: no-internal-docs
      # Last, because it is the one leg that a busy machine can fail on a tree
      # that has not changed, and task stops at the first leg that fails:
      # anywhere earlier it would hide the legs after it, secrets among them.
      - task: hook-time

  tools:
    desc: Assert the toolchain this repository requires is present at the pinned versions
    silent: true
    cmds:
      - |
        fail=0
        have_go=$(go version 2>/dev/null | awk '{print $3}' | sed 's/^go//')
        want_go=$(awk '/^go /{print $2; exit}' go.mod)
        if [ -z "$have_go" ]; then
          echo "sdlc: Go is not installed. Install Go ${want_go} or newer: https://go.dev/dl/" >&2
          fail=1
        fi
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "sdlc: shellcheck is not installed. This repository pins {{.SHELLCHECK_VERSION}}." >&2
          echo "      macOS:  brew install shellcheck" >&2
          echo "      Linux:  apt-get install shellcheck   (or: dnf install ShellCheck)" >&2
          echo "      Other:  https://github.com/koalaman/shellcheck#installing" >&2
          fail=1
        else
          have_sc=$(shellcheck --version | awk '/^version:/{print $2}')
          if [ "$have_sc" != "{{.SHELLCHECK_VERSION}}" ]; then
            echo "sdlc: shellcheck ${have_sc} is installed, this repository pins {{.SHELLCHECK_VERSION}}." >&2
            echo "      Different versions disagree about what is a warning. Install the pinned one," >&2
            echo "      or bump SHELLCHECK_VERSION in Taskfile.yml on trunk if the new one is correct." >&2
            fail=1
          fi
        fi
        if ! command -v node >/dev/null 2>&1; then
          # A version manager (nvm, fnm, asdf) often installs node as a shell
          # function that only exists in an interactive shell. The node is
          # really there; it is just invisible to scripts and to CI. Saying
          # "install Node" to someone who has four of them is unhelpful, so
          # look before prescribing.
          found=""
          for candidate in "$HOME"/.nvm/versions/node/*/bin/node \
                           "$HOME"/.local/share/fnm/node-versions/*/installation/bin/node \
                           "$HOME"/.asdf/installs/nodejs/*/bin/node \
                           "$HOME"/.volta/tools/image/node/*/bin/node; do
            [ -x "$candidate" ] && found="$candidate" && break
          done
          if [ -n "$found" ]; then
            echo "sdlc: node is installed at ${found}, but it is not on PATH for" >&2
            echo "      non-interactive shells -- your version manager exposes it as a shell" >&2
            echo "      function, so scripts and CI cannot see it." >&2
            echo "      Fix, for this shell and anything it starts:" >&2
            echo "        export PATH=\"$(dirname "$found"):\$PATH\"" >&2
            echo "      To make it permanent, load your version manager eagerly rather than" >&2
            echo "      lazily, or add that directory to PATH in your shell profile." >&2
          else
            echo "sdlc: Node is not installed, and markdownlint runs on it." >&2
            echo "      Install Node 22 or newer: https://nodejs.org/en/download" >&2
          fi
          fail=1
        fi
        # The secrets leg builds a throwaway snapshot of the working tree, which
        # needs mktemp and `git rev-parse --path-format=absolute` (git 2.31).
        # Without a check each one ends the leg in a raw shell error. Windows
        # is not asked for mktemp: task runs its own there.
        if [ "{{OS}}" != "windows" ] && ! command -v mktemp >/dev/null 2>&1; then
          echo "sdlc: mktemp is not installed. The secrets leg uses it to build a throwaway snapshot of the working tree." >&2
          echo "      macOS/Linux: part of coreutils, already on PATH." >&2
          fail=1
        fi
        if ! command -v git >/dev/null 2>&1; then
          echo "sdlc: git is not installed. Install git 2.31 or newer: https://git-scm.com/downloads" >&2
          fail=1
        else
          have_git=$(git --version | awk '{print $3}')
          if ! awk -v v="$have_git" 'BEGIN { split(v, a, "."); exit !(a[1] > 2 || (a[1] == 2 && a[2] >= 31)) }'; then
            echo "sdlc: git ${have_git} is installed, the secrets leg needs 2.31 or newer (git rev-parse --path-format)." >&2
            echo "      Update git: https://git-scm.com/downloads" >&2
            fail=1
          fi
        fi
        [ "$fail" -eq 0 ] || exit 1
      - |
        # Warms the two caches test/checklegs needs. `check` runs `test` before
        # `markdownlint` and `secrets` ever fill them, so those two tests skipped
        # -- not failed -- on every CI run. Each call is what the later leg does
        # anyway, only earlier: `npm ci` is idempotent, and `--version` is the
        # cheapest gitleaks command that still resolves and builds the module.
        npm ci --prefix .github/tools/markdownlint --ignore-scripts --no-audit --no-fund
        {{.GITLEAKS}} --version >/dev/null

  build:
    desc: Build the sdlc binary into dist/
    silent: true
    cmds:
      - |
        out=dist/sdlc
        [ "{{OS}}" = "windows" ] && out=dist/sdlc.exe
        mkdir -p dist
        go build -o "$out" ./cmd/sdlc
        echo "built $out"
        echo
        echo "To try the plugin from this checkout:"
        echo "  export PATH=\"$(pwd)/dist:\$PATH\""
        echo "  claude --plugin-dir $(pwd)/plugin"

  fmt:
    desc: Format Go source, with the gofmt of the toolchain go.mod pins
    cmds:
      - |
        toolchain=$(awk '/^toolchain /{print $2; exit}' go.mod)
        GOTOOLCHAIN="${toolchain:-local}" go fmt ./...

  fmt-check:
    desc: Fail if any Go source is unformatted
    silent: true
    cmds:
      - |
        # gofmt's layout changes between Go releases, and CI formats with the
        # toolchain go.mod pins. Checking with whatever Go is installed here
        # once passed a file that failed on every CI runner.
        gofmt=gofmt
        toolchain=$(awk '/^toolchain /{print $2; exit}' go.mod)
        goroot=$(GOTOOLCHAIN="${toolchain:-local}" go env GOROOT 2>/dev/null)
        if [ -n "$goroot" ] && [ -x "$goroot/bin/gofmt{{exeExt}}" ]; then
          gofmt="$goroot/bin/gofmt{{exeExt}}"
        else
          echo "sdlc: could not get Go ${toolchain}; checking with the gofmt on PATH, which CI may disagree with" >&2
        fi
        # Each story worktree under .sdlc/worktrees is a whole copy of the
        # source at its story's state; `gofmt -l .` walked into them and
        # reported their files as this checkout's.
        unformatted=$(find . -path ./.sdlc/worktrees -prune -o -type f -name '*.go' -print0 |
          xargs -0 "$gofmt" -l 2>/dev/null)
        if [ -n "$unformatted" ]; then
          tracked=$(git ls-files --cached '*.go')
          untracked=$(git ls-files --others --exclude-standard '*.go')
          ignored=$(git ls-files --others --ignored --exclude-standard '*.go')
          echo "sdlc: these files are not gofmt-clean:" >&2
          printf '%s\n' "$unformatted" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}' >&2
          echo "      Fix: ./task fmt" >&2
          exit 1
        fi

  tidy-check:
    desc: Fail if go.mod or go.sum is not what `go mod tidy` would write
    silent: true
    cmds:
      # go.mod had cobra and pflag marked `// indirect` while internal/cli
      # imports both. Nothing was wrong with the build; the file just said
      # something untrue about the dependency graph, which is the file's one
      # job. Nothing checked it, so it stayed wrong.
      - |
        if ! go mod tidy -diff; then
          echo "go.mod/go.sum are not tidy. Run: go mod tidy" >&2
          exit 1
        fi

  vet:
    desc: go vet
    silent: true
    cmds:
      - |
        out=$(go vet ./... 2>&1) || {
          tracked=$(git ls-files --cached '*.go')
          untracked=$(git ls-files --others --exclude-standard '*.go')
          ignored=$(git ls-files --others --ignored --exclude-standard '*.go')
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}' >&2
          exit 1
        }
        if [ -n "$out" ]; then printf '%s\n' "$out"; fi

  lint:
    desc: golangci-lint
    silent: true
    cmds:
      - |
        # The pinned linter reads the standard library as the installed Go
        # compiled it, and can only read the releases it knows. With Go 1.27.2
        # installed and go.mod pinning 1.27.1, every file failed typecheck here
        # ("export data version 5 is greater than maximum supported version 4")
        # while CI, which runs the pinned toolchain, passed.
        toolchain=$(awk '/^toolchain /{print $2; exit}' go.mod)
        out=$(GOTOOLCHAIN="${toolchain:-local}" {{.GOLANGCI}} run 2>&1) || {
          tracked=$(git ls-files --cached '*.go')
          untracked=$(git ls-files --others --exclude-standard '*.go')
          ignored=$(git ls-files --others --ignored --exclude-standard '*.go')
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}' >&2
          exit 1
        }
        if [ -n "$out" ]; then printf '%s\n' "$out"; fi

  test:
    desc: Go tests with race detection
    silent: true
    cmds:
      - |
        # go test gives a package ten minutes unless told otherwise, and under
        # the race detector internal/shellpolicy once reached that on a loaded
        # macOS runner and was killed mid-test. The limit is twenty, short
        # enough that a real hang is reported by go test, with the test's
        # name, before the CI job's thirty minutes end it with none. It is not
        # lower because internal/cli is not fast enough: in CI run 40600769689
        # it took 325s on ubuntu-latest and 1055s on macos-latest, and on
        # windows-latest go test killed it at the twenty minutes. Its time is
        # the git processes the commands under test start, about 88,000 in a
        # run of its tests, and a shorter limit waits on fewer of them.
        #
        # The limit only ever went up, because nothing said a package was
        # nearing it until one passed it. So go test writes events, and
        # testtime prints from them what go test would have, then each
        # package's time, the slowest tests, and every package over half the
        # limit. If testtime cannot run, the events are printed as they are:
        # what failed is still in them.
        dir=$({{.MKTEMP_DIR}})
        trap 'rm -rf "$dir"' EXIT
        status=0
        go test -race -json -timeout {{.TEST_TIMEOUT}} ./... > "$dir/test.json" 2>&1 || status=$?
        out=$(GOFLAGS= go run ./internal/tools/testtime -limit {{.TEST_TIMEOUT}} < "$dir/test.json" 2>&1) || out=$(cat "$dir/test.json")
        [ "$status" -eq 0 ] || {
          # go test's failure lines carry only a test file's bare name, which
          # cannot be matched against a full path, and two packages can hold a
          # file of the same name. So say, per failing package, whether every
          # .go file in it is one a clean clone would also have.
          echo "$out" >&2
          modpath=$(awk '/^module /{print $2; exit}' go.mod)
          failed=$(printf '%s\n' "$out" | awk '$1=="FAIL" && NF>=2 {print $2}')
          for pkg in $failed; do
            rel=${pkg#$modpath}
            rel=${rel#/}
            pattern="$rel/*.go"
            if [ -z "$rel" ]; then pattern="*.go"; fi
            pkg_untracked=$(git ls-files --others --exclude-standard "$pattern")
            pkg_ignored=$(git ls-files --others --ignored --exclude-standard "$pattern")
            if [ -z "$pkg_untracked" ] && [ -z "$pkg_ignored" ]; then
              echo "sdlc: every .go file go test ran in $pkg is tracked by git." >&2
            else
              echo "sdlc: $pkg has .go file(s) git does not track the same way on a clean clone:" >&2
              if [ -n "$pkg_untracked" ]; then
                printf '%s\n' "$pkg_untracked" | sed 's/^/      untracked, git add would accept it: /' >&2
              fi
              if [ -n "$pkg_ignored" ]; then
                printf '%s\n' "$pkg_ignored" | sed 's/^/      is gitignored, so a clean clone does not have it and CI will not report this:/' >&2
              fi
            fi
          done
          exit 1
        }
        printf '%s\n' "$out"

  check-linux:
    desc: Run the Go tests on Linux in Docker, against a clone of HEAD, as CI's Linux jobs do (PLATFORMS="linux/arm64 linux/amd64" for both)
    silent: true
    cmds:
      - |
        # 2492472 passed every test on a Mac and failed three on both Linux
        # runners: the tests read the developer's own machine as much as the
        # code. This runs them where CI does, a fresh clone with no git
        # identity and no HOME of the developer's, as a user who is not root,
        # so the next one is found before trunk. It clones HEAD, so commit
        # first: what is not committed is not tested. Windows cannot run in
        # Docker on a Mac; CONTRIBUTING.md says what covers it.
        if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
          echo "check-linux needs a running Docker engine: https://docs.docker.com/get-started/get-docker/" >&2
          exit 1
        fi
        toolchain=$(awk '/^toolchain /{print $2; exit}' go.mod)
        image="golang:${toolchain#go}"
        cache="${XDG_CACHE_HOME:-$HOME/.cache}/sdlc-check-linux"
        mkdir -p "$cache"
        # A bundle, not the checkout mounted: in a worktree .git is a file
        # naming a directory outside the mount, and the clone failed on it.
        git bundle create -q "$cache/head.bundle" HEAD --tags
        # The engine's own architecture unless told otherwise. The other one
        # runs under emulation: on an Apple silicon Mac linux/amd64 took over
        # twenty minutes for internal/cli alone and failed every timing test,
        # which says nothing about the code.
        platforms='{{.PLATFORMS}}'
        if [ -z "$platforms" ]; then
          # The engine's, not an image's: a golang image pulled earlier for
          # linux/amd64 answered amd64 on an arm64 engine.
          case $(docker info 2>/dev/null | awk '/Architecture:/{print $2; exit}') in
            aarch64 | arm64) platforms=linux/arm64 ;;
            x86_64 | amd64) platforms=linux/amd64 ;;
            *) echo "check-linux could not read the Docker engine's architecture; name it: PLATFORMS=linux/arm64" >&2; exit 1 ;;
          esac
        fi
        status=0
        for platform in $platforms; do
          arch=${platform#linux/}
          mkdir -p "$cache/$arch"
          echo "== $platform ($image)"
          docker pull -q --platform "$platform" "$image" >/dev/null
          docker run --rm --platform "$platform" \
            --user "$(id -u):$(id -g)" \
            -v "$cache/head.bundle:/src.bundle:ro" -v "$cache/$arch:/cache" \
            -e HOME=/tmp/home -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod \
            -e GOTOOLCHAIN=local -e GOFLAGS= \
            "$image" sh -ceu '
              mkdir -p "$HOME"
              git clone -q /src.bundle /tmp/work
              cd /tmp/work
              # As `test` runs them, so that the times printed are the ones
              # a Linux runner would print.
              s=0
              go test -race -json -timeout {{.TEST_TIMEOUT}} ./... > /tmp/test.json 2>&1 || s=$?
              go run ./internal/tools/testtime -limit {{.TEST_TIMEOUT}} < /tmp/test.json || cat /tmp/test.json
              exit $s
            ' || status=1
        done
        exit $status

  test-report:
    desc: Print the commands and gate record keys no test through the built binary runs, and the tests in each package
    silent: true
    # A report, not a leg of check: it exits 0 however long the list is. The
    # guard in test/e2e is what fails.
    cmds:
      - go run ./internal/tools/testreport

  profile:
    desc: Profile one package's tests and print their slowest tests and where the CPU and memory went (PKG=./internal/cli, RUN=regexp, FLAGS=-race)
    silent: true
    # Not a leg of check. `test` names a package that is getting slow; this
    # says why. go test profiles one package at a time, so one is named.
    cmds:
      - |
        pkg='{{.PKG}}'
        if [ -z "$pkg" ]; then
          echo "sdlc: name the package to profile, as a directory: ./task profile PKG=./internal/cli" >&2
          exit 2
        fi
        dir=$({{.MKTEMP_DIR}})
        status=0
        # The test binary is kept beside the profiles: pprof needs it to name
        # what it read.
        GOFLAGS= go test -count=1 -json -timeout 30m {{.FLAGS}} -run '{{.RUN | default "."}}' -o "$dir/pkg.test" \
          -cpuprofile "$dir/cpu.out" -memprofile "$dir/mem.out" "$pkg" > "$dir/test.json" 2>&1 || status=$?
        GOFLAGS= go run ./internal/tools/testtime -n 25 < "$dir/test.json" || cat "$dir/test.json"
        if [ -s "$dir/cpu.out" ]; then
          echo
          echo "== CPU, by the function it was spent in"
          go tool pprof -top -nodecount=25 "$dir/pkg.test" "$dir/cpu.out" 2>/dev/null
          echo
          echo "== CPU, by the function it was spent under"
          go tool pprof -top -cum -nodecount=25 "$dir/pkg.test" "$dir/cpu.out" 2>/dev/null
          echo
          echo "== memory allocated, by the function that allocated it"
          go tool pprof -top -sample_index=alloc_space -nodecount=15 "$dir/pkg.test" "$dir/mem.out" 2>/dev/null
        fi
        echo
        echo "The profiles are in $dir, kept for a closer look:"
        echo "  go tool pprof -http=: $dir/pkg.test $dir/cpu.out"
        echo "CPU is this process's only: a test that waits for git or the binary shows"
        echo "as time in the slowest tests above and not here."
        exit $status

  bench:
    desc: Run the benchmarks with their allocations, COUNT times each, for benchstat (PKG=./..., BENCH=regexp, COUNT=10)
    silent: true
    # Not a leg of check: a benchmark's time is the machine's as much as the
    # code's, so it is compared, never held to a figure. CONTRIBUTING.md says
    # how to compare two trees with `benchstat`.
    cmds:
      - GOFLAGS= go test -run '^$' -bench '{{.BENCH | default "."}}' -benchmem -count {{.COUNT | default "10"}} {{.PKG | default "./..."}}

  benchstat:
    desc: Compare two saved runs of ./task bench (OLD=file NEW=file)
    silent: true
    cmds:
      - |
        if [ -z '{{.OLD}}' ] || [ -z '{{.NEW}}' ]; then
          echo "sdlc: name the two runs to compare: ./task benchstat OLD=old.txt NEW=new.txt" >&2
          exit 2
        fi
        {{.BENCHSTAT}} '{{.OLD}}' '{{.NEW}}'

  npm-test:
    desc: Test the npm installer package
    silent: true
    cmds:
      - |
        # `node --test DIR` treats the directory as one test file; the glob is
        # what makes it run each file. Quoted so the shell leaves it to node.
        #
        # Captured rather than piped. Task's embedded shell has errexit on but
        # pipefail off, so `node --test ... | tail` reported the failure in its
        # output and still exited 0 -- this leg could not fail.
        #
        # TAP named, not left to the default: Node 23 made the default reporter
        # spec, which prints no "# tests" line, and the check below failed a
        # green run.
        annotate() {
          tracked=$(git ls-files --cached 'npm/test/*.test.js')
          untracked=$(git ls-files --others --exclude-standard 'npm/test/*.test.js')
          ignored=$(git ls-files --others --ignored --exclude-standard 'npm/test/*.test.js')
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}' >&2
        }
        out=$(node --test --test-reporter=tap 'npm/test/*.test.js' 2>&1) || {
          annotate
          exit 1
        }
        # A glob that matches nothing is zero tests and exit 0, which passed a
        # renamed test file as a green leg.
        if ! echo "$out" | grep -q '^# tests [1-9]'; then
          annotate
          echo "sdlc: node ran no tests from npm/test/*.test.js" >&2
          exit 1
        fi
        echo "$out" | tail -n 8

  actionlint:
    desc: Lint GitHub Actions workflows
    silent: true
    cmds:
      - |
        out=$({{.ACTIONLINT}} 2>&1) || {
          tracked=$(git ls-files --cached '.github/workflows/*.yml' '.github/workflows/*.yaml')
          untracked=$(git ls-files --others --exclude-standard '.github/workflows/*.yml' '.github/workflows/*.yaml')
          ignored=$(git ls-files --others --ignored --exclude-standard '.github/workflows/*.yml' '.github/workflows/*.yaml')
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}' >&2
          exit 1
        }
        if [ -n "$out" ]; then printf '%s\n' "$out"; fi

  shellcheck:
    desc: Lint shell scripts
    silent: true
    cmds:
      - |
        # 'plugin/bin/sdlc-hook' by name: it has no .sh suffix, and it is the
        # one script that runs on every matching tool call in every session.
        # --others --exclude-standard so a script that is written but not yet
        # committed is linted too. `./task check` is what you run before
        # committing, and plain `git ls-files` sees only what is already in.
        files=$(git ls-files --cached --others --exclude-standard \
          '*.sh' 'task' 'plugin/bin/sdlc-hook' 2>/dev/null)
        if [ -n "$files" ]; then
          # shellcheck disable=SC2086
          out=$(shellcheck $files 2>&1) || {
            tracked=$(git ls-files --cached '*.sh' 'task' 'plugin/bin/sdlc-hook' 2>/dev/null)
            untracked=$(git ls-files --others --exclude-standard '*.sh' 'task' 'plugin/bin/sdlc-hook' 2>/dev/null)
            ignored=$(git ls-files --others --ignored --exclude-standard '*.sh' 'task' 'plugin/bin/sdlc-hook' 2>/dev/null)
            printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}'
            exit 1
          }
          if [ -n "$out" ]; then printf '%s\n' "$out"; fi
        fi

  shellcheck-checksums:
    desc: Regenerate .github/shellcheck.sha256 after bumping SHELLCHECK_VERSION
    silent: true
    cmds:
      - |
        # Run this on trunk whenever SHELLCHECK_VERSION changes. CI installs
        # shellcheck from a GitHub release asset, and a release asset can be
        # replaced without the tag moving, so the bytes are pinned here.
        set -eu
        version="{{.SHELLCHECK_VERSION}}"
        out=.github/shellcheck.sha256
        tmp=$({{.MKTEMP_DIR}})
        trap 'rm -rf "$tmp"' EXIT
        {
          echo "# sha256 of every shellcheck release asset CI installs, cross-checked against"
          echo "# the digests GitHub reports for the release. The version is in the filename,"
          echo "# so bumping SHELLCHECK_VERSION in Taskfile.yml without regenerating this file"
          echo "# fails the lookup rather than passing with a stale hash."
          echo "#"
          echo "# Regenerate with: ./task shellcheck-checksums"
        } > "$tmp/out"
        for asset in \
          "shellcheck-v${version}.darwin.aarch64.tar.xz" \
          "shellcheck-v${version}.darwin.x86_64.tar.xz" \
          "shellcheck-v${version}.linux.aarch64.tar.xz" \
          "shellcheck-v${version}.linux.x86_64.tar.xz" \
          "shellcheck-v${version}.zip"; do
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 -o "$tmp/$asset" "$url"
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$tmp/$asset" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$tmp/$asset" | awk '{print $1}')
          fi
          # GNU coreutils prefixes the line with a backslash when the filename
          # contains one, which is what a Windows temporary path looks like.
          sum="${sum#\\}"
          printf '%s  %s\n' "$sum" "$asset" >> "$tmp/out"
          echo "  $asset  $sum" >&2
        done
        mv "$tmp/out" "$out"
        echo "wrote $out" >&2

  syft-checksums:
    desc: Regenerate .github/syft.sha256 after bumping SYFT_VERSION
    silent: true
    cmds:
      - |
        # Run this on trunk whenever SYFT_VERSION changes. The release job
        # installs syft from a GitHub release asset and runs it after the
        # archives are built and before they are attested, so the bytes are
        # pinned here.
        set -eu
        version="{{.SYFT_VERSION}}"
        out=.github/syft.sha256
        tmp=$({{.MKTEMP_DIR}})
        trap 'rm -rf "$tmp"' EXIT
        {
          echo "# sha256 of every syft release asset the release job installs, cross-checked"
          echo "# against the digests GitHub reports for the release. The version is in the"
          echo "# filename, so bumping SYFT_VERSION in Taskfile.yml without regenerating this"
          echo "# file fails the lookup rather than passing with a stale hash."
          echo "#"
          echo "# Regenerate with: ./task syft-checksums"
        } > "$tmp/out"
        for asset in \
          "syft_${version}_linux_amd64.tar.gz" \
          "syft_${version}_linux_arm64.tar.gz"; do
          url="https://github.com/anchore/syft/releases/download/v${version}/${asset}"
          curl -fsSL --retry 3 -o "$tmp/$asset" "$url"
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$tmp/$asset" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$tmp/$asset" | awk '{print $1}')
          fi
          printf '%s  %s\n' "$sum" "$asset" >> "$tmp/out"
          echo "  $asset  $sum" >&2
        done
        mv "$tmp/out" "$out"
        echo "wrote $out" >&2

  powershell:
    desc: Parse install.ps1, so a syntax error is not first seen by a Windows user
    silent: true
    cmds:
      - |
        # Scope, declared rather than hidden: PowerShell is a large install to
        # ask of a contributor on macOS or Linux. Every CI runner has it --
        # including the Ubuntu and macOS ones -- so this leg runs on every
        # commit on all three, and the file is never merged unparsed. It is
        # just not always parsed on a developer's own machine.
        for shell in pwsh powershell; do
          if command -v "$shell" >/dev/null 2>&1; then
            "$shell" -NoProfile -NonInteractive -Command '
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
              Write-Output "powershell: install.ps1 parses"'
            exit $?
          fi
        done
        echo "powershell: not run -- no pwsh here. This leg runs on the Windows CI runner on every commit."

  markdownlint:
    desc: Lint Markdown
    silent: true
    cmds:
      # From a lockfile rather than `npx markdownlint-cli2@<version>`, which
      # pins that one package and resolves everything under it afresh on every
      # run. To bump it, change the version in
      # .github/tools/markdownlint/package.json and run
      # `npm install --package-lock-only --ignore-scripts` there.
      # package.json overrides one package below markdownlint-cli2 0.24.0:
      # katex, which markdownlint 0.42.0 reaches through its math extension
      # (micromark-extension-math 3.1.0 asks for ^0.16.0, a range with an
      # advisory against it; drop the override once that resolves to 0.18.2 or
      # later). The smol-toml and markdown-it overrides were dropped when
      # markdownlint-cli2 began to pin smol-toml 1.9.1 and markdown-it 15.0.3.
      - npm ci --prefix .github/tools/markdownlint --ignore-scripts --no-audit --no-fund
      - |
        out=$(node .github/tools/markdownlint/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs 2>&1) || {
          tracked=$(git ls-files --cached '*.md')
          untracked=$(git ls-files --others --exclude-standard '*.md')
          ignored=$(git ls-files --others --ignored --exclude-standard '*.md')
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}'
          exit 1
        }
        printf '%s\n' "$out"

  linkcheck:
    desc: Check relative links in README.md and docs/, and that README links into no docs/ page
    silent: true
    cmds:
      - |
        out=$(go run ./internal/tools/linkcheck 2>&1) || {
          tracked=$(git ls-files --cached '*.md')
          untracked=$(git ls-files --others --exclude-standard '*.md')
          ignored=$(git ls-files --others --ignored --exclude-standard '*.md')
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}' >&2
          exit 1
        }
        if [ -n "$out" ]; then printf '%s\n' "$out"; fi

  init-time:
    desc: Assert package init stays inside the hook latency budget
    silent: true
    cmds:
      - |
        # In dist/, as `build` does, not /tmp: on Windows go build and this
        # shell read /tmp as two different places, and the binary was not found.
        mkdir -p dist
        bin="dist/sdlc-init-$${{exeExt}}"
        go build -o "$bin" ./cmd/sdlc
        # The first run of a fresh binary pays to page itself in, which on a
        # shared CI runner can be ten times the steady-state cost and has
        # nothing to do with how much init the code does. Take the floor of
        # several runs: that is the number a hook actually pays, since a
        # session invokes the binary over and over.
        total=""
        for _ in 1 2 3 4; do
          # Captured, not piped into awk: without .exe the binary never started
          # on Windows, awk found no init lines in its error, and 0 ms passed
          # the budget on every run there.
          if ! trace=$(GODEBUG=inittrace=1 "$bin" version 2>&1 >/dev/null); then
            echo "sdlc: $bin version failed, so init time was not measured:" >&2
            echo "$trace" >&2
            rm -f "$bin"
            exit 1
          fi
          if ! echo "$trace" | grep -q '^init '; then
            echo "sdlc: GODEBUG=inittrace=1 printed no init lines, so init time was not measured." >&2
            rm -f "$bin"
            exit 1
          fi
          run=$(echo "$trace" \
            | awk '/^init /{for(i=1;i<=NF;i++) if($i=="clock,") s+=$(i-2)} END{printf "%.3f", s+0}')
          total=$(awk -v a="$total" -v b="$run" 'BEGIN{ if (a=="" || b+0 < a+0) print b; else print a }')
        done
        rm -f "$bin"
        over=$(awk -v t="$total" -v b="{{.INIT_BUDGET_MS}}" 'BEGIN{print (t>b) ? 1 : 0}')
        if [ "$over" = "1" ]; then
          echo "sdlc: package init takes ${total} ms, over the {{.INIT_BUDGET_MS}} ms budget." >&2
          echo "      A hook runs on every matching tool call, so this is felt on every" >&2
          echo "      turn of the user's session. Find it with:" >&2
          echo "        go build -o /tmp/sdlc ./cmd/sdlc && GODEBUG=inittrace=1 /tmp/sdlc version" >&2
          echo "      The usual cause is a new import doing work in init() or in a" >&2
          echo "      package-level variable. Move it into a function." >&2
          exit 1
        fi
        echo "init: ${total} ms (budget {{.INIT_BUDGET_MS}} ms)"

  hook-time:
    desc: Assert the classifier answers nine slow commands inside their budgets
    silent: true
    cmds:
      # One command with nothing around it, so the program's exit is the leg's.
      # init-time measures through the shell and passed on every Windows run
      # for it: the binary never started, and what awk did not find compared
      # as 0 ms. Here the timing, the comparison and the temporary directory
      # are all the program's, and a budget it cannot read is refused.
      # GOFLAGS is emptied as it is for the sandbox: with -n in a caller's
      # shell this `go run` ran nothing and exited 0, and with -race the
      # commands take twenty times as long.
      - GOFLAGS= go run ./internal/tools/hooktime -perl={{.HOOK_PERL_BUDGET_MS}} -here-string={{.HOOK_HERESTRING_BUDGET_MS}} -dot-glob={{.HOOK_DOTGLOB_BUDGET_MS}}

  licenses:
    desc: Assert every dependency that ships in the binary has a licence we can ship
    silent: true
    cmds:
      - |
        # The binary is redistributed -- in release archives, through npm, on
        # other people's machines -- so what is linked into it is what this
        # project is handing out. A dependency whose licence does not permit
        # that is a problem to find on the commit that adds it, not in an
        # issue from someone's legal team.
        {{.GOLICENSES}} check ./cmd/sdlc \
          --allowed_licenses=MIT,Apache-2.0,BSD-3-Clause,BSD-2-Clause,ISC
        echo "licenses: every dependency in the binary is redistributable"

  sandbox:
    desc: Make a throwaway repository with sdlc initialised, built from this checkout, and print where it is
    silent: true
    # The sandbox gives go a home of its own, where go would look for its
    # caches, find none and want the network. Go is asked here, with the
    # developer's own home, where they are, and the sandbox is told.
    env:
      GOCACHE:
        sh: go env GOCACHE
      GOMODCACHE:
        sh: go env GOMODCACHE
      GOPATH:
        sh: go env GOPATH
    # GOFLAGS is emptied for this `go run` as well as for the build inside it,
    # so a caller's flags do not change what is built here. It does not cover
    # the `task` wrapper, which is a `go run` of its own and reads GOFLAGS
    # before this line is reached: with -n there, nothing runs at all and the
    # exit is still 0. Words after `--` are passed on so that they are refused,
    # not dropped; each is quoted again before the shell reads it.
    cmds:
      - GOFLAGS= go run ./internal/tools/sandbox create {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}

  sandbox-remove:
    desc: Remove a sandbox that `./task sandbox` made -- `./task sandbox-remove -- <dir>`
    silent: true
    # Each word after `--` is quoted again before the shell reads it: a path
    # with a space in it stays one word, and nothing in one is run as a command.
    cmds:
      - GOFLAGS= go run ./internal/tools/sandbox remove {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}

  release-check:
    desc: Assert every file that carries the version agrees, and the changelog has a section for it
    cmds:
      - go run ./internal/tools/release check

  release-snapshot:
    desc: Build the release archives locally, without tagging or publishing anything
    silent: true
    cmds:
      - |
        # --skip=sbom: the SBOM step shells out to syft, which the release
        # workflow installs and a laptop generally has not. Everything else --
        # the builds, the archives, the checksums -- is exactly what a release
        # produces, which is the point of running this before cutting one.
        #
        # A snapshot is named from the last tag: `0.2.0-snapshot` after v0.2.0,
        # and `0.0.0-snapshot` in a checkout that has never been tagged.
        # GORELEASER_CURRENT_TAG does not override it -- snapshot mode ignores
        # that variable -- so the number here is not the one in plugin.json,
        # and is not meant to be. Everything else is what a release produces.
        go run github.com/goreleaser/goreleaser/v2@v{{.GORELEASER_VERSION}} \
          release --snapshot --clean --skip=sbom
        echo
        echo "dist/ now holds what a release would publish:"
        ls -1 dist/*.tar.gz dist/*.zip dist/checksums.txt 2>/dev/null || true

  secrets:
    desc: Scan for credentials, committed and about to be
    silent: true
    cmds:
      # Two scans, because they answer different questions. `git` reads the
      # history: a credential committed once is compromised even if the next
      # commit removed it. `dir` reads the working tree, which is the one that
      # can still be prevented -- and it is what `./task check` is run for.
      # With only the first, a token sitting in an uncommitted file passed.
      - "{{.GITLEAKS}} git --no-banner --redact -v"
      - |
        set -eu -o pipefail
        # `gitleaks dir` has no .gitignore-aware flag, so a plain `dir .` also
        # scanned this clone's own loop records, which a clean checkout never
        # has. A throwaway snapshot stands in for everything git tracks or
        # would accept with `git add`; git's own tree walk picks the files, so
        # no file name is ever handed to a shell command as an argument.
        #
        # GIT_INDEX_FILE alone redirects only the index: `git add` and
        # `git write-tree` still wrote a blob for every untracked file into the
        # repository's real object store, readable with `git cat-file` after the
        # file was deleted -- the very files this leg exists to protect. So new
        # objects go under $workdir, and the real store is an alternate, so an
        # unmodified tracked file's blob is found rather than duplicated. Its
        # path comes from --git-common-dir: in a linked worktree the per-worktree
        # git dir has no objects/ at all.
        #
        # The path is spelt with slashes throughout: on Windows mktemp answers
        # with backslashes, and git is then handed one path spelt both ways.
        workdir=$({{.MKTEMP_DIR}})
        workdir=${workdir//\\//}
        trap 'rm -rf "$workdir"' EXIT
        mkdir "$workdir/objects" "$workdir/tree"
        real_objects="$(git rev-parse --path-format=absolute --git-common-dir)/objects"
        before=$(git count-objects -v | awk '/^count:/{print $2}')

        GIT_INDEX_FILE="$workdir/index" GIT_OBJECT_DIRECTORY="$workdir/objects" \
          GIT_ALTERNATE_OBJECT_DIRECTORIES="$real_objects" git -c core.safecrlf=false add -A .
        # git writes the files out itself. This was `git archive | tar -x -C`,
        # and on Windows task runs its own tar, which has no -C and reads no
        # pipe, so the leg could not finish there once mktemp worked.
        GIT_INDEX_FILE="$workdir/index" GIT_OBJECT_DIRECTORY="$workdir/objects" \
          GIT_ALTERNATE_OBJECT_DIRECTORIES="$real_objects" git checkout-index --all --prefix="$workdir/tree/"

        after=$(git count-objects -v | awk '/^count:/{print $2}')
        if [ "$before" != "$after" ]; then
          echo "sdlc: the secrets leg's snapshot changed the loose-object count of the repository's real object store, so it was not scanned." >&2
          echo "      Check that no other git process (git gc, a fetch, an editor's git integration) is running in this repository, then run ./task secrets again. If it recurs, run git gc, or report it." >&2
          exit 1
        fi
        # Held against the snapshot's own index, which is what `git add -A`
        # kept: a tracked file deleted but not yet staged is in `git ls-files
        # --cached` and not in the snapshot, so counting the real index aborted
        # on an ordinary mid-edit tree. A copy that stopped early leaves files
        # the index names and the snapshot lacks -- an empty copy must never
        # read as a clean scan. git names them, not find: task's own find on
        # Windows takes neither parentheses nor -o.
        missing=$(GIT_INDEX_FILE="$workdir/index" git --work-tree="$workdir/tree" ls-files --deleted | wc -l | tr -d ' ')
        if [ "$missing" -ne 0 ]; then
          want=$(GIT_INDEX_FILE="$workdir/index" git ls-files | wc -l | tr -d ' ')
          echo "sdlc: the secrets leg's snapshot lacks $missing of the $want file(s) expected, so it was not scanned." >&2
          echo "      The copy of the working tree is incomplete. Check free space in the system temp directory, then run ./task secrets again." >&2
          exit 1
        fi

        out=$(cd "$workdir/tree" && {{.GITLEAKS}} dir --no-banner --redact -v . 2>&1) || {
          tracked=$(git ls-files --cached)
          untracked=$(git ls-files --others --exclude-standard)
          ignored=$(git ls-files --others --ignored --exclude-standard)
          printf '%s\n' "$out" | sdlc_tracked="$tracked" sdlc_untracked="$untracked" sdlc_ignored="$ignored" awk '{{.ANNOTATE_AWK}}'
          exit 1
        }
        printf '%s\n' "$out"

  no-internal-docs:
    desc: Assert no internal document and no third party's machine path is tracked
    silent: true
    cmds:
      - |
        out=$(go run ./internal/tools/linkcheck -mode=hygiene 2>&1) || {
          printf '%s\n' "$out" >&2
          echo "sdlc: hygiene mode reads only git ls-files, so every file named above is tracked by git." >&2
          exit 1
        }
        if [ -n "$out" ]; then printf '%s\n' "$out"; fi
