name: coverage

# A workflow of its own rather than a job in ci.yml: release.yml calls ci.yml
# with `contents: read` and nothing else, and a called workflow may not ask for
# more than its caller grants, so an `id-token: write` job there would stop a
# release before it started. Codecov reports; `task check` in ci.yml is the bar.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: coverage profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The npm installer tests skip without node, and a skipped test is
      # coverage the loop's own measurement would have counted.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'

      # The same invocation as commands.coverage in .sdlc/config.json, so the
      # figure Codecov shows and the one coverage_min is held to come from the
      # same run. Codecov counts lines and `go tool cover` counts statements,
      # so the two differ by a fraction.
      - name: Run the tests with a coverage profile
        shell: bash
        run: go test ./... -count=1 -coverprofile="${RUNNER_TEMP}/cover.out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-profile
          path: ${{ runner.temp }}/cover.out
          if-no-files-found: error
          retention-days: 1

  # Apart from the job above so that the tests, and whatever they run, never
  # share a job with the permission to mint an identity token.
  upload:
    name: upload to Codecov
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Codecov takes GitHub's OIDC token in place of a secret
    steps:
      # Codecov matches the profile's module paths against the files in the
      # commit, so the upload needs the tree even though nothing here runs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-profile
          path: ${{ runner.temp }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ runner.temp }}/cover.out
          disable_search: true
          # A pull request from a fork is given no identity token. Codecov
          # accepts an upload from a fork of a public repository without one.
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          # An outage at Codecov is not a fault in the commit.
          fail_ci_if_error: false
