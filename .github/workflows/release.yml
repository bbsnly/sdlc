name: release

on:
  push:
    tags: ['v*']

# Read-only by default. The release job asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same bar every commit has to clear, on all three platforms, run again
  # against the tagged commit. A tag can point anywhere; this is what makes
  # "it passed on main" true of the thing actually being released.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its archives
      id-token: write # provenance for the archives and for the npm package
      attestations: write
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # goreleaser and npm are given their tokens explicitly and upload
          # over the API. The default would leave a contents:write token in
          # .git/config for the whole job, including while npm's dependency
          # tree runs.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The released binary is not built out of a cache. A tag can restore
          # the default branch's cache, which is written by CI runs that
          # execute third-party linters, and Go does not re-verify a cached
          # build output against its inputs. A planted entry would be compiled
          # into the release and then attested -- accurately, and worthlessly.
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.x'
          registry-url: 'https://registry.npmjs.org'

      # Fail before anything is published rather than halfway through. A
      # release that made it to GitHub and not to npm is the worst outcome
      # here: the version exists, and the install line in the release notes
      # does not work.
      - name: Preflight
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set, so @bbsnly/sdlc cannot be published." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run." >&2
            exit 1
          fi
          # Not just that the token exists: that it can publish. An expired or
          # read-only token passes a non-empty check and fails at the last
          # step of the run, which is the one place failing is expensive.
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN cannot authenticate to npm: ${who}" >&2
            exit 1
          fi
          echo "npm: authenticated as ${who}"

          go run ./internal/tools/release -tag "${GITHUB_REF_NAME}" check
          version=$(go run ./internal/tools/release version)

          # A version already on npm cannot be published again, and npm is the
          # last step. Finding out now costs nothing.
          if npm view "@bbsnly/sdlc@${version}" version >/dev/null 2>&1; then
            echo "::error::@bbsnly/sdlc@${version} is already published; npm versions are immutable." >&2
            exit 1
          fi

          # A tag can point at any commit. Without this, `git tag v9 <sha>`
          # releases code that was never on trunk -- the tagged commit's own
          # CI runs, so the checks are real, but nobody reviewed it.
          # Explicit refspec: `git fetch origin main` only reliably updates
          # FETCH_HEAD, and the remote-tracking ref is what merge-base reads.
          # (`--depth=0` is not "unshallow" -- it is `fatal: depth 0 is not a
          # positive number`, which would have failed the first release here.)
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main." >&2
            echo "Releases come from trunk. Merge it first, then tag." >&2
            exit 1
          fi

      - name: Read pinned tool versions
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          read_pin() {
            value=$(sed -n "s/^[[:space:]]*$1:[[:space:]]*\([^[:space:]]*\).*/\1/p" Taskfile.yml | head -n 1)
            if [ -z "${value}" ]; then
              echo "::error::$1 is not set in Taskfile.yml" >&2
              exit 1
            fi
            echo "$2=${value}" >> "${GITHUB_OUTPUT}"
          }
          read_pin SYFT_VERSION syft
          read_pin GORELEASER_VERSION goreleaser

      - name: Install pinned syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v${{ steps.pins.outputs.syft }}

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          go run ./internal/tools/release notes -o release-notes.md
          # An empty file would publish an empty release rather than fail.
          if [ ! -s release-notes.md ]; then
            echo "::error::release-notes.md is empty; CHANGELOG.md has no section for this version." >&2
            exit 1
          fi

      - name: Build and publish the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_VERSION: ${{ steps.pins.outputs.goreleaser }}
        run: |
          set -euo pipefail
          go run "github.com/goreleaser/goreleaser/v2@v${GORELEASER_VERSION}" release \
            --clean --release-notes release-notes.md

      # goreleaser reads --release-notes inside its changelog pipe, and several
      # ordinary-looking settings skip that pipe entirely -- in which case the
      # notes are read, handed over and silently discarded, and the release
      # goes out with nothing but the footer. Checking the published body is
      # the only way to know the file actually arrived.
      - name: Check the release says what the changelog says
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --json body --jq .body > published-body.md
          # Compared line by line: the body has a footer appended, so it is a
          # superset of the notes rather than equal to them. Blank lines are
          # dropped because the template joins the parts with its own.
          missing=$(grep -vxFf published-body.md release-notes.md | grep -v '^[[:space:]]*$' || true)
          if [ -n "${missing}" ]; then
            echo "::error::the release body is missing lines from release-notes.md" >&2
            printf '%s\n' "${missing}" >&2
            exit 1
          fi
          echo "release body carries every line of the changelog section"

      # What GitHub can say about these files that the files cannot say about
      # themselves: which workflow, in which repository, at which commit,
      # produced them. Verified with `gh attestation verify`.
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Everything the release serves, which includes the two install
          # scripts: they go out as release assets and the notes link them at
          # the tag, so they are as downloadable as the archives are. An
          # unattested installer is the weakest link in a chain that attests
          # everything it installs.
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            install.sh
            install.ps1

      # Before npm, because the npm package is the one thing here that cannot
      # be taken back: published versions are immutable and unpublishing is
      # restricted. The package's installer downloads from this release, so
      # publishing it while the release is still a draft would put a broken
      # `npx @bbsnly/sdlc install` on the registry permanently.
      #
      # goreleaser publishes a draft, so until this step the archives are
      # uploaded but not downloadable: a run that fails anywhere above leaves
      # nothing half-released, and no one can fetch an archive that has not
      # been attested yet. If the npm step below fails, this release is still
      # correct and complete on its own -- every other install route works,
      # and the publish can be rerun.
      - name: Open the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"

      - name: Publish @bbsnly/sdlc
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # The checksums travel inside the package. npm packages are
          # immutable once published, so a checksum that shipped with the
          # installer is a stronger promise than one fetched at install time
          # from the same place as the download.
          cp dist/checksums.txt npm/checksums.txt
          cp LICENSE npm/LICENSE

          # The package's whole verification story is that it carries the pins
          # for its own release. If that copy were ever missing or stale, the
          # installer would quietly fall back to fetching them and nothing
          # would fail -- so it is asserted here instead.
          version=$(go run ./internal/tools/release version)
          if ! grep -q "sdlc_${version}_linux_amd64.tar.gz" npm/checksums.txt; then
            echo "::error::npm/checksums.txt does not describe ${version}" >&2
            exit 1
          fi

          # A pre-release must not become what `npm install` gives people by
          # default, so it goes out under `next` instead of `latest`. Read from
          # the version rather than the ref: a hyphen anywhere in a tag is not
          # the same thing as a semver pre-release.
          tag=latest
          case "${version}" in *-*) tag=next ;; esac
          npm publish ./npm --provenance --access public --tag "$tag"

