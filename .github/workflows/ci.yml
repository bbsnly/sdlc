name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow, so a tag clears the same bar as a commit
  # rather than a copy of it that has drifted.
  workflow_call:

# Read-only by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

# A new push supersedes the one before it. An in-flight run of an older commit
# is answering a question nobody is asking any more, on three runners.
# The "ci-" prefix keeps this group distinct from the release workflow's own,
# which would otherwise collide when release.yml calls this one: inside a
# called workflow, github.workflow is the caller's name.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Nothing here pushes, and gitleaks reads history without auth. The
          # default leaves the job's token in .git/config for every later step,
          # including the third-party linters `task check` runs.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.x'

      # The Taskfile pins shellcheck and refuses to run without that exact
      # version, so CI installs that version rather than whatever the runner
      # image happens to ship.
      - name: Install pinned shellcheck
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*SHELLCHECK_VERSION:[[:space:]]*\([^[:space:]]*\).*/\1/p' Taskfile.yml | head -n 1)
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   asset="shellcheck-v${version}.linux.x86_64.tar.xz" ;;
            Linux-ARM64) asset="shellcheck-v${version}.linux.aarch64.tar.xz" ;;
            macOS-ARM64) asset="shellcheck-v${version}.darwin.aarch64.tar.xz" ;;
            macOS-X64)   asset="shellcheck-v${version}.darwin.x86_64.tar.xz" ;;
            Windows-*)   asset="shellcheck-v${version}.zip" ;;
            *) echo "no pinned shellcheck build for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          # A GitHub release asset is mutable: the tag staying put does not
          # mean the bytes behind it did. This binary goes on PATH ahead of
          # everything else in the job, so it is verified like any download.
          want=$(awk -v a="${asset}" '$2 == a { print $1 }' .github/shellcheck.sha256)
          if [ -z "${want}" ]; then
            echo "::error::no sha256 for ${asset} in .github/shellcheck.sha256" >&2
            echo "SHELLCHECK_VERSION was bumped without regenerating it:" >&2
            echo "  ./task shellcheck-checksums" >&2
            exit 1
          fi
          url="https://github.com/koalaman/shellcheck/releases/download/v${version}/${asset}"
          mkdir -p "${RUNNER_TEMP}/shellcheck"
          # The release host returns a 500 often enough to redden a run on its
          # own. The default backoff gives up after about seven seconds, which
          # is shorter than these outages last.
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 20 -o "${RUNNER_TEMP}/${asset}" "$url" || {
            echo "could not download ${asset} from ${url}" >&2
            echo "this is the shellcheck release host, not the build: re-run the job" >&2
            exit 1
          }
          if command -v sha256sum >/dev/null 2>&1; then
            got=$(sha256sum "${RUNNER_TEMP}/${asset}" | awk '{print $1}')
          else
            got=$(shasum -a 256 "${RUNNER_TEMP}/${asset}" | awk '{print $1}')
          fi
          # GNU coreutils escapes a line whose filename contains a backslash by
          # prefixing the whole line with one. RUNNER_TEMP on the Windows runner
          # is a D:\a\_temp path, so the hash comes back as \8a4e35... and
          # compares unequal to an identical hash.
          got="${got#\\}"
          if [ "${got}" != "${want}" ]; then
            echo "::error::${asset} does not match its pinned checksum" >&2
            echo "expected ${want}" >&2
            echo "got      ${got}" >&2
            exit 1
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            unzip -q -o "${RUNNER_TEMP}/${asset}" -d "${RUNNER_TEMP}/shellcheck"
          else
            tar -xJf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}/shellcheck" --strip-components=1
          fi
          echo "${RUNNER_TEMP}/shellcheck" >> "${GITHUB_PATH}"

      - name: task check
        shell: bash
        run: ./task check

      # The Windows entry point, from the shell Windows users actually type it
      # in. `task check` above runs the POSIX twin under bash, so task.cmd had
      # never been executed anywhere -- including the line that passes the
      # repository directory to task, where a trailing backslash silently ate
      # the quote after it.
      - name: task.cmd
        if: runner.os == 'Windows'
        shell: cmd
        run: task.cmd --list

  # The npm package names the oldest Node it supports, and nothing ever ran it
  # there: every job installs 22, so ">=18" was a promise with nothing behind
  # it. The floor is read out of package.json rather than written here, so
  # raising the claim and testing the claim are the same edit.
  npm-engines:
    name: npm on the oldest Node it claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the floor out of the package
        id: floor
        shell: bash
        run: |
          set -euo pipefail
          floor=$(sed -n 's/.*"node" *: *">=\([0-9][0-9]*\).*/\1/p' npm/package.json)
          if [ -z "${floor}" ]; then
            echo "::error::npm/package.json has no engines.node of the form \">=N\"" >&2
            exit 1
          fi
          echo "version=${floor}" >> "${GITHUB_OUTPUT}"
          echo "the package claims Node ${floor} and up"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.floor.outputs.version }}

      # A directory rather than a glob: passing patterns to --test arrived
      # after this floor, and the point is to run on what the package claims.
      - name: The package's own tests, on the version it promises
        shell: bash
        run: node --test npm/test/

  # Every target a release publishes, compiled. `task check` builds only for
  # the runner it is on, so three of the six platforms goreleaser ships were
  # built for the first time during the release itself -- the one run where a
  # compile error costs the most. This is seconds of work and takes that risk
  # off release day entirely.
  cross:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every platform we ship
        shell: bash
        run: |
          set -euo pipefail
          # Read from .goreleaser.yml rather than repeated here, so adding a
          # platform to a release cannot forget to add it to this check.
          goos=$(sed -n 's/^ *goos: \[\(.*\)\]$/\1/p' .goreleaser.yml | tr -d ' ' | tr ',' ' ')
          goarch=$(sed -n 's/^ *goarch: \[\(.*\)\]$/\1/p' .goreleaser.yml | tr -d ' ' | tr ',' ' ')
          if [ -z "${goos}" ] || [ -z "${goarch}" ]; then
            echo "::error::could not read goos/goarch out of .goreleaser.yml" >&2
            exit 1
          fi
          for os in ${goos}; do
            for arch in ${goarch}; do
              echo "==> ${os}/${arch}"
              GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build -o /dev/null ./cmd/sdlc
            done
          done
          # `go vet` is per-platform too: a build tag or a syscall constant can
          # be wrong on one GOOS and fine on the rest.
          for os in ${goos}; do
            GOOS="${os}" go vet ./...
          done

  # The architectures no `check` runner covers. A release publishes six
  # platforms; until this job existed, three of them -- linux/arm64,
  # darwin/amd64, windows/arm64 -- had never run the binary they ship, let
  # alone installed it. This runs the tests and every installer route that
  # applies, which is what the primary runners do, without the linters and
  # vendored-kit legs that are not architecture-dependent.
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The npm installer is one of the routes under test, so node has to be
      # here for it to be tested rather than skipped.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.x'

      - name: Say which platform this actually is
        shell: bash
        run: go version && go env GOOS GOARCH

      - name: Install every way this platform can be installed
        shell: bash
        run: go test -count=1 ./test/install/...

      - name: The test suite, on this architecture
        shell: bash
        run: |
          set -euo pipefail
          # Everything except the installers, which the step above already ran
          # and which are slow enough not to want twice.
          go list ./... | grep -v '/test/install$' | xargs go test -count=1
