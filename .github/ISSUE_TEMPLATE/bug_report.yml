name: Bug report
description: Something does not work the way it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The single most useful thing you can
        include is the output of `sdlc doctor --json` from the project where
        it happened — it answers most of the questions below at once.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what came back. Paste the command and its output.
      placeholder: |
        $ sdlc gate implementation pass
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: sdlc doctor --json
      description: Run it in the project where this happened. Redact anything you would rather not publish.
      render: json

  - type: input
    id: version
    attributes:
      label: sdlc version
      description: The output of `sdlc version`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true

  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: A rule that refused something it should have allowed? Paste the refusal — it names the rule.
