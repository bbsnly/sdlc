# The templates ask for the version, the platform and what `sdlc doctor` says,
# which is most of what any report needs. A blank issue skips all three, and
# the first reply is then always the same three questions.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/bbsnly/sdlc/security/advisories/new
    about: Report it privately instead, so the details stay private until there is a fix.
  - name: An error code you do not understand
    url: https://github.com/bbsnly/sdlc/blob/main/docs/troubleshooting.md
    about: Every SDLC-E code has a heading there, with what to do about it.
